<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://qjnqnchqqbuzjvlkytjl.supabase.co; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>药理学刷题 · 管理端</title>
  <link rel="icon" href="../icon.svg">
  <link rel="stylesheet" href="../quiz.css">
  <link rel="stylesheet" href="../portal.css?v=3">
</head>
<body>
<section class="portal" id="login">
  <div class="login-card">
    <div class="portal-icon" aria-hidden="true">药</div>
    <h1>刷题管理端</h1>
    <p>开通刷题 ID，查看学习进度</p>
    <form class="portal-form" id="admin-form">
      <label for="admin-id">管理员 ID</label>
      <input id="admin-id" type="password" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="输入管理员 ID" required maxlength="128">
      <p id="login-error" class="form-error" role="alert"></p>
      <button class="btn primary" type="submit">登录管理端</button>
    </form>
    <a class="portal-link" href="../?v=3">返回用户端</a>
  </div>
</section>

<main class="admin-shell" id="dashboard" hidden>
  <header>
    <h1>刷题管理端</h1>
    <div><a href="../?v=3">打开用户端</a><button type="button" id="sign-out">退出登录</button></div>
  </header>
  <section class="admin-card">
    <h2>添加刷题 ID</h2>
    <form id="add-form" class="portal-form admin-form">
      <div class="admin-field">
        <label for="new-student-id">刷题 ID</label>
        <input id="new-student-id" type="text" required maxlength="128" autocomplete="off" spellcheck="false" autocapitalize="off">
      </div>
      <div class="admin-field">
        <label for="student-label">姓名或备注（选填）</label>
        <input id="student-label" type="text" maxlength="80" autocomplete="off">
      </div>
      <button class="btn primary" type="submit">添加 ID</button>
    </form>
    <div class="issued" id="issued" hidden>
      <p>请把这个 ID 发给对应学员，对方按原样输入即可登录。</p>
      <div><input id="issued-id" type="text" readonly aria-label="已开通的刷题 ID"><button class="btn" type="button" id="copy-id">复制</button></div>
    </div>
    <p class="admin-feedback" id="feedback" role="status"></p>
  </section>

  <section class="admin-card admin-roster">
    <header>
      <h2>学员与学习进度 <small id="student-count"></small></h2>
      <button class="btn" type="button" id="reload">刷新</button>
    </header>
    <p id="empty-list">还没有学员，添加后可在此查看。</p>
    <div class="admin-table-wrap" id="table-wrap" hidden>
      <table class="admin-table">
        <thead><tr><th scope="col">学员</th><th scope="col">状态</th><th scope="col">已练题数</th><th scope="col">作答次数</th><th scope="col">正确率</th><th scope="col">错题</th><th scope="col">最近活动</th><th scope="col">操作</th></tr></thead>
        <tbody id="roster"></tbody>
      </table>
    </div>
  </section>
</main>
<script type="module" src="./admin.js?v=3"></script>
</body>
</html>
